name: Publish pdf-seal to Docker Hub

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "Dockerfile"

permissions:
  contents: read

jobs:
  push_to_docker_hub:
    name: Build and Push Docker Image
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. Equivalent to: docker login
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # No release event on a plain merge to main, so pull the version straight
      # from package.json to use as the image tag.
      - name: Read version from package.json
        id: package_version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # 2 & 3. Equivalent to: docker build & docker push
      - name: Build and push pdf-seal
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          # Tags the image with the package.json version and 'latest'.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pdf-seal:${{ steps.package_version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/pdf-seal:latest