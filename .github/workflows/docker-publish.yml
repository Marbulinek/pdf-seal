name: Publish pdf-seal to Docker Hub

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "Dockerfile"

jobs:
  push_to_docker_hub:
    name: Build and Push Docker Image
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      # 1. Equivalent to: docker login
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # No release event on a plain merge to main, so pull the version straight
      # from package.json to use as the image tag.
      - name: Read version from package.json
        id: package_version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # 2 & 3. Equivalent to: docker build & docker push
      - name: Build and push pdf-seal
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Tags the image with the package.json version, the commit SHA, and 'latest'.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pdf-seal:${{ steps.package_version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/pdf-seal:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/pdf-seal:latest